<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Rooms - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
        <div class="navbar-nav gap-2 align-items-center">
            <a class="nav-link" href="/admin/dashboard">Dashboard</a>
            <a class="nav-link" href="/admin/rooms">Rooms</a>
            <a class="nav-link" href="/admin/facilities">Facilities</a>
            <a class="nav-link" href="/admin/users">Users</a>
            <a class="nav-link" href="/admin/bookings">Bookings</a>
            <a class="nav-link" href="/admin/reports">Reports</a>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Meeting Room Management</h3>
        <a href="/admin/rooms/new" class="btn btn-primary">+ Add New Room</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Code</th>
                    <th>Room Name</th>
                    <th>Building</th>
                    <th>Floor</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>TV Display Link</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td class="fw-bold" th:text="${room.roomCode}">MR-101</td>
                    <td th:text="${room.roomName}">Conference Room A</td>
                    <td th:text="${room.building}">Building 1</td>
                    <td th:text="${room.floor}">Floor 2</td>
                    <td th:text="${room.capacity} + ' Persons'">10 Persons</td>
                    <td>
                        <span class="badge bg-success" th:if="${room.active}">Active</span>
                        <span class="badge bg-secondary" th:if="${!room.active}">Inactive</span>
                    </td>
                    <td>
                        <a th:href="@{/tv/room/{code}(code=${room.roomCode})}" target="_blank" class="btn btn-sm btn-outline-info">Open Display</a>
                        <a th:href="@{/admin/facilities/assign/{id}(id=${room.roomId})}" class="btn btn-sm btn-outline-info">Facilities</a>
                    </td>
                    <td class="d-flex gap-2">
                        <a th:href="@{/admin/rooms/{id}/edit(id=${room.roomId})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{/admin/rooms/{id}/delete(id=${room.roomId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this room? This cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
