<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
        <div class="navbar-nav gap-2 align-items-center">
            <a class="nav-link" href="/admin/dashboard">Dashboard</a>
            <a class="nav-link" href="/admin/rooms">Rooms</a>
            <a class="nav-link" href="/admin/facilities">Facilities</a>
            <a class="nav-link" href="/admin/users">Users</a>
            <a class="nav-link" href="/admin/bookings">Bookings</a>
            <a class="nav-link" href="/admin/reports">Reports</a>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">User Management</h3>
        <a href="/admin/users/new" class="btn btn-primary">+ Add New User</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td class="fw-bold" th:text="${u.employeeId}">EMP001</td>
                    <td th:text="${u.name}">Name</td>
                    <td th:text="${u.email}">email@example.com</td>
                    <td th:text="${u.department}">Dept</td>
                    <td>
                        <span class="badge bg-success" th:if="${u.status}">Active</span>
                        <span class="badge bg-secondary" th:if="${!u.status}">Inactive</span>
                    </td>
                    <td class="d-flex gap-2">
                        <a th:href="@{/admin/users/{id}/edit(id=${u.userId})}" class="btn btn-sm btn-outline-primary">Edit</a>

                        <form th:action="@{/admin/users/{id}/status(id=${u.userId})}" method="post" class="d-inline">
                            <input type="hidden" name="active" th:value="${!u.status}">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${u.status} ? 'btn-outline-danger' : 'btn-outline-success'"
                                    th:text="${u.status} ? 'Disable' : 'Enable'">Toggle</button>
                        </form>

                        <form th:action="@{/admin/users/{id}/reset-password(id=${u.userId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Reset password for this user?');">
                            <button type="submit" class="btn btn-sm btn-outline-warning">Reset Password</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="text-center text-muted py-4">No users found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
