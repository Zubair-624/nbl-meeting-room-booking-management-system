<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Report View - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Booking Report</h3>
        <a href="/admin/reports" class="btn btn-secondary">Back to Reports</a>
    </div>

    <p class="text-muted">Period: <span th:text="${startDate}"></span> to <span th:text="${endDate}"></span></p>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr class="table-primary">
                    <th class="fw-bold text-primary">Booking ID</th>
                    <th class="fw-bold text-primary">Title</th>
                    <th class="fw-bold text-primary">Room</th>
                    <th class="fw-bold text-primary">Booked By</th>
                    <th class="fw-bold text-primary">Date</th>
                    <th class="fw-bold text-primary">Time</th>
                    <th class="fw-bold text-primary">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.bookingId}">1</td>
                    <td th:text="${b.meetingTitle}">Meeting</td>
                    <td th:text="${b.room.roomName}">Room</td>
                    <td th:text="${b.user.name}">User</td>
                    <td th:text="${b.bookingDate}">Date</td>
                    <td th:text="${b.startTime} + ' - ' + ${b.endTime}">Time</td>
                    <td th:text="${b.status}">Status</td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="7" class="text-center text-muted py-4">No bookings found for this period.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
