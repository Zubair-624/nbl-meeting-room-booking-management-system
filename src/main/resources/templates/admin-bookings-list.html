<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Bookings - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
        <div class="navbar-nav gap-2 align-items-center">
            <a class="nav-link" href="/admin/dashboard">Dashboard</a>
            <a class="nav-link" href="/admin/rooms">Rooms</a>
            <a class="nav-link" href="/admin/facilities">Facilities</a>
            <a class="nav-link" href="/admin/users">Users</a>
            <a class="nav-link" href="/admin/bookings">Bookings</a>
            <a class="nav-link" href="/admin/reports">Reports</a>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="fw-bold mb-4">All System Bookings</h3>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Room</th>
                    <th>User</th>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b, iter : ${bookings}">
                    <td th:text="${iter.count}">1</td>
                    <td class="fw-bold" th:text="${b.room.roomName}">Room A</td>
                    <td th:text="${b.user.name}">John Doe</td>
                    <td th:text="${b.meetingTitle}">Sprint Planning</td>
                    <td th:text="${b.bookingDate}">2026-08-03</td>
                    <td th:text="${b.startTime} + ' - ' + ${b.endTime}">10:00 - 11:00</td>
                    <td>
                        <span class="badge bg-warning text-dark" th:if="${b.status == 'Pending'}" th:text="${b.status}">Pending</span>
                        <span class="badge bg-success" th:if="${b.status == 'Approved'}" th:text="${b.status}">Approved</span>
                        <span class="badge bg-danger" th:if="${b.status == 'Cancelled' || b.status == 'Rejected'}" th:text="${b.status}">Cancelled</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/bookings/{id}/status(id=${b.bookingId})}" method="post" class="d-inline" th:if="${b.status == 'Pending'}">
                            <input type="hidden" name="status" value="Approved">
                            <button type="submit" class="btn btn-sm btn-success">Approve</button>
                        </form>
                        <form th:action="@{/admin/bookings/{id}/status(id=${b.bookingId})}" method="post" class="d-inline" th:if="${b.status == 'Pending'}">
                            <input type="hidden" name="status" value="Rejected">
                            <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
