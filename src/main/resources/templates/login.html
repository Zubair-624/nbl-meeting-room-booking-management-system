<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MRBMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">MRBMS</a>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm border-0 p-4">
                    <div class="card-body">

                        <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
                        <p class="text-muted text-center mb-4">Login to manage your meeting room bookings</p>

                        <div th:if="${param.error}" class="alert alert-danger">
                            Invalid email or password.
                        </div>

                        <div th:if="${param.logout}" class="alert alert-info">
                            You have been logged out.
                        </div>

                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">
                                <label for="username" class="form-label">Email or Employee ID</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter email or employee ID" required autocomplete="username">
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>

                        </form>

                        <div class="text-center mt-4">
                            <span class="text-muted">Don't have an account?</span>
                            <a href="/register" class="text-decoration-none">Register here</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
