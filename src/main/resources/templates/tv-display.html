<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="60">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${room.roomName} + ' - Room Display'">Room Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .status-header { padding: 2rem; border-radius: 12px; }
        .bg-occupied { background-color: #dc3545; }
        .bg-available { background-color: #198754; }
        .card-custom { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
    </style>
</head>
<body class="p-4">

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-4 fw-bold" th:text="${room.roomName}">Conference Room A</h1>
            <p class="fs-4 text-secondary" th:text="'Building: ' + ${room.building} + ' | Floor: ' + ${room.floor}">Building 1 | Floor 2</p>
        </div>
        <div class="text-end">
            <h2 id="clock" class="fw-bold text-info"></h2>
            <span class="text-secondary" th:text="${#temporals.format(#temporals.createNow(), 'EEEE, MMMM d, yyyy')}">Monday, August 3, 2026</span>
        </div>
    </div>

    <!-- Status Banner -->
    <div class="status-header mb-4 text-center" th:classappend="${isOccupied} ? 'bg-occupied' : 'bg-available'">
        <h2 class="display-5 fw-bold mb-0" th:text="${isOccupied} ? 'OCCUPIED' : 'AVAILABLE'">AVAILABLE</h2>
    </div>

    <div class="row g-4">
        <!-- Current Meeting -->
        <div class="col-md-6">
            <div class="card card-custom h-100 p-4">
                <h4 class="text-warning mb-3">CURRENT MEETING</h4>
                <div th:if="${currentBooking != null}">
                    <h2 class="fw-bold" th:text="${currentBooking.meetingTitle}">Sprint Review</h2>
                    <p class="fs-4 text-light" th:text="${currentBooking.startTime} + ' - ' + ${currentBooking.endTime}">10:00 - 11:30</p>
                    <hr class="border-secondary">
                    <p class="mb-1 text-secondary">Organizer</p>
                    <h4 th:text="${currentBooking.user.name}">John Doe</h4>
                </div>
                <div th:if="${currentBooking == null}" class="py-5 text-center text-secondary">
                    <h3>No ongoing meeting</h3>
                </div>
            </div>
        </div>

        <!-- Next Meeting -->
        <div class="col-md-6">
            <div class="card card-custom h-100 p-4">
                <h4 class="text-info mb-3">NEXT MEETING</h4>
                <div th:if="${nextBooking != null}">
                    <h2 class="fw-bold" th:text="${nextBooking.meetingTitle}">Architecture Sync</h2>
                    <p class="fs-4 text-light" th:text="${nextBooking.startTime} + ' - ' + ${nextBooking.endTime}">14:00 - 15:00</p>
                    <hr class="border-secondary">
                    <p class="mb-1 text-secondary">Organizer</p>
                    <h4 th:text="${nextBooking.user.name}">Jane Smith</h4>
                </div>
                <div th:if="${nextBooking == null}" class="py-5 text-center text-secondary">
                    <h3>No upcoming meetings for today</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
