<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Room - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
        <div class="navbar-nav gap-2 align-items-center">
            <a class="nav-link" href="/admin/dashboard">Dashboard</a>
            <a class="nav-link active" href="/admin/rooms">Rooms</a>
            <a class="nav-link" href="/admin/facilities">Facilities</a>
            <a class="nav-link" href="/admin/users">Users</a>
            <a class="nav-link" href="/admin/bookings">Bookings</a>
            <a class="nav-link" href="/admin/reports">Reports</a>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="card-title mb-0 fw-bold">Add Meeting Room</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${room.roomId} != null ? @{/admin/rooms/{id}/save(id=${room.roomId})} : @{/admin/rooms/save}"
                          th:object="${room}" method="post">

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Room Code</label>
                                <input type="text" th:field="*{roomCode}" class="form-control" placeholder="e.g. MR-101" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Room Name</label>
                                <input type="text" th:field="*{roomName}" class="form-control" placeholder="e.g. Main Boardroom" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Building</label>
                                <input type="text" th:field="*{building}" class="form-control" placeholder="e.g. Building A" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Floor</label>
                                <input type="number" th:field="*{floor}" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Capacity</label>
                                <input type="number" th:field="*{capacity}" class="form-control" min="1" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Facilities or room notes..."></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="statusCheck" checked>
                            <label class="form-check-label" for="statusCheck">Active for Booking</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/admin/rooms" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Save Room</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
