<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Facilities - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
        <div class="navbar-nav gap-2 align-items-center">
            <a class="nav-link" href="/admin/dashboard">Dashboard</a>
            <a class="nav-link" href="/admin/rooms">Rooms</a>
            <a class="nav-link" href="/admin/facilities">Facilities</a>
            <a class="nav-link" href="/admin/users">Users</a>
            <a class="nav-link" href="/admin/bookings">Bookings</a>
            <a class="nav-link" href="/admin/reports">Reports</a>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="fw-bold mb-4">Facility Management</h3>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm border-0 mb-4 p-3">
        <form th:action="@{/admin/facilities/save}" th:object="${facility}" method="post" class="d-flex gap-2">
            <input type="text" class="form-control" th:field="*{facilityName}" placeholder="e.g. Projector, Whiteboard, HDMI" required>
            <button type="submit" class="btn btn-primary">Add Facility</button>
        </form>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Facility Name</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="f : ${facilities}">
                    <td th:text="${f.facilityName}">Projector</td>
                    <td>
                        <form th:action="@{/admin/facilities/{id}/delete(id=${f.facilityId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this facility?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(facilities)}">
                    <td colspan="2" class="text-center text-muted py-4">No facilities added yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
