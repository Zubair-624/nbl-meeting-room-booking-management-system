<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Room - MRBMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/employee/dashboard}">MRBMS</a>

        <div class="d-flex align-items-center gap-3 text-white">
            <span th:text="${user.name}">Employee Name</span>

            <a th:href="@{/employee/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a th:href="@{/employee/bookings}" class="btn btn-outline-light btn-sm">My Bookings</a>
            <a th:href="@{/employee/calendar}" class="btn btn-outline-primary btn-sm">Calendar</a>

            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="card-title mb-0">
                        Book Room: <span class="text-primary" th:text="${room.roomName}">Conference Room</span>
                    </h4>
                    <small class="text-muted" th:text="'Building: ' + ${room.building} + ' | Floor: ' + ${room.floor} + ' | Capacity: ' + ${room.capacity} + ' persons'">Details</small>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/employee/bookings/create(roomId=${room.roomId})}" th:object="${booking}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Meeting Title</label>
                            <input type="text" th:field="*{meetingTitle}" class="form-control" placeholder="e.g. Q3 Sprint Planning" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Brief agenda or purpose..."></textarea>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Booking Date</label>
                                <input type="date" th:field="*{bookingDate}" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Start Time</label>
                                <input type="time" th:field="*{startTime}" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">End Time</label>
                                <input type="time" th:field="*{endTime}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Expected Participants</label>
                            <input type="number" th:field="*{participants}" class="form-control" min="1" th:max="${room.capacity}" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/employee/rooms}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Confirm Booking</button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/script.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
