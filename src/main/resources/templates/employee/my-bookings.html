<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - MRBMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/employee/dashboard">MRBMS</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span th:text="${user.name}">Employee Name</span>
            <a href="/employee/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/employee/rooms" class="btn btn-outline-light btn-sm">Book a Room</a>
            <a href="/employee/calendar" class="btn btn-outline-primary btn-sm">Calendar</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="fw-bold mb-4">My Bookings</h3>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Room</th>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td class="fw-bold" th:text="${b.room.roomName}">Room A</td>
                    <td th:text="${b.meetingTitle}">Sprint Planning</td>
                    <td th:text="${b.bookingDate}">2026-08-03</td>
                    <td th:text="${b.startTime} + ' - ' + ${b.endTime}">10:00 - 11:00</td>
                    <td>
                        <span class="badge bg-warning text-dark" th:if="${b.status == 'Pending'}" th:text="${b.status}">Pending</span>
                        <span class="badge bg-success" th:if="${b.status == 'Approved'}" th:text="${b.status}">Approved</span>
                        <span class="badge bg-danger" th:if="${b.status == 'Cancelled' || b.status == 'Rejected'}" th:text="${b.status}">Cancelled</span>
                    </td>
                    <td>
                        <form th:action="@{/employee/bookings/{id}/cancel(id=${b.bookingId})}" method="post"
                              th:if="${b.status == 'Pending' || b.status == 'Approved'}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="6" class="text-center text-muted py-4">You have no bookings yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
