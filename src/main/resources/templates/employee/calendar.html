<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - MRBMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <style>
        .fc-daygrid-event {
            white-space: normal !important;
            overflow: visible !important;
        }
        .fc-event-title {
            white-space: normal !important;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/employee/dashboard">MRBMS</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span th:text="${user.name}">Employee Name</span>
            <a href="/employee/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/employee/rooms" class="btn btn-outline-light btn-sm">Book a Room</a>
            <a href="/employee/bookings" class="btn btn-outline-light btn-sm">My Bookings</a>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="fw-bold mb-4">Room Booking Calendar</h3>
    <div class="card shadow-sm border-0 p-3">
        <div id="calendar"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            headerToolbar: {
                left: 'prev,next today jumpToDate',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            customButtons: {
                jumpToDate: {
                    text: 'Go to Date',
                    click: function() {
                        var input = document.createElement('input');
                        input.type = 'date';
                        input.style.position = 'fixed';
                        input.style.top = '-100px';
                        document.body.appendChild(input);
                        input.addEventListener('change', function() {
                            calendar.gotoDate(input.value);
                            document.body.removeChild(input);
                        });
                        input.click();
                    }
                }
            },
            events: '/api/calendar/events',
            height: 'auto',
            slotMinTime: '07:00:00',
            slotMaxTime: '20:00:00'
        });
        calendar.render();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
