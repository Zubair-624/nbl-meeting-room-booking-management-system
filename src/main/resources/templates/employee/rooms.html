<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Rooms - MRBMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/employee/dashboard">MRBMS</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span th:text="${user.name}">Employee Name</span>
            <a href="/employee/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/employee/bookings" class="btn btn-outline-light btn-sm">My Bookings</a>
            <a href="/employee/calendar" class="btn btn-outline-primary btn-sm">Calendar</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="fw-bold mb-4">Available Meeting Rooms</h3>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row g-4">
        <div class="col-md-4" th:each="room : ${rooms}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${room.roomName}">Room Name</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="'Code: ' + ${room.roomCode}">MR-101</h6>
                    <p class="card-text text-secondary" th:text="${room.description}">Room description goes here...</p>

                    <ul class="list-group list-group-flush mb-3">
                        <li class="list-group-item px-0 py-1"><strong>Building:</strong> <span th:text="${room.building}">Main</span></li>
                        <li class="list-group-item px-0 py-1"><strong>Floor:</strong> <span th:text="${room.floor}">2</span></li>
                        <li class="list-group-item px-0 py-1"><strong>Capacity:</strong> <span th:text="${room.capacity} + ' People'">10 People</span></li>
                    </ul>

                    <a th:href="@{/employee/bookings/new(roomId=${room.roomId})}" class="btn btn-primary w-100">Book Room</a>
                </div>
            </div>
        </div>

        <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(rooms)}">
            <p class="fs-5">No rooms available at the moment.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
