<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - MRBMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/employee/dashboard">MRBMS</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-muted" th:text="'Logged in as: ' + ${user.name}">Welcome, Employee</span>
            <a href="/employee/rooms" class="btn btn-outline-primary btn-sm">Book a Room</a>
            <a href="/employee/calendar" class="btn btn-outline-primary btn-sm">Calendar</a>
            <a href="/employee/bookings" class="btn btn-outline-primary btn-sm">My Bookings</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">

    <!-- Profile Summary Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">User Profile Details</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <strong>Employee ID:</strong> <span th:text="${user.employeeId}">EMP001</span>
                </div>
                <div class="col-md-4">
                    <strong>Full Name:</strong> <span th:text="${user.name}">John Doe</span>
                </div>
                <div class="col-md-4">
                    <strong>Email:</strong> <span th:text="${user.email}">john@example.com</span>
                </div>
                <div class="col-md-4">
                    <strong>Department:</strong> <span th:text="${user.department}">IT</span>
                </div>
                <div class="col-md-4">
                    <strong>Designation:</strong> <span th:text="${user.designation}">Developer</span>
                </div>
                <div class="col-md-4">
                    <strong>Phone:</strong> <span th:text="${user.phone}">+123456789</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Example: Rendering records from an associated table (e.g. Bookings or Roles) -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
            <h5 class="card-title mb-0">Assigned Roles</h5>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Role Name</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="userRole, stat : ${user.userRoles}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${userRole.role.roleName}">ROLE_EMPLOYEE</td>
                </tr>
                <tr th:if="${#lists.isEmpty(user.userRoles)}">
                    <td colspan="2" class="text-muted text-center">No roles assigned.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
