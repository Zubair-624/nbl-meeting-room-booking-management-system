<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - MRBMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top mrbms-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/employee/dashboard">
            <span class="brand-icon">
                <i class="bi bi-building"></i>
            </span>
            <span class="brand-text">MRBMS</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navContent">
            <div class="d-flex flex-lg-row flex-column align-items-lg-center gap-2 gap-lg-3 mt-3 mt-lg-0">

                <a href="/employee/rooms" class="btn nav-pill">
                    <i class="bi bi-door-open"></i> Book a Room
                </a>
                <a href="/employee/calendar" class="btn nav-pill">
                    <i class="bi bi-calendar3"></i> Calendar
                </a>
                <a href="/employee/bookings" class="btn nav-pill">
                    <i class="bi bi-journal-check"></i> My Bookings
                </a>

                <div class="vr d-none d-lg-block mx-1"></div>

                <div class="dropdown">
                    <button class="btn user-chip dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <span class="avatar" th:text="${#strings.substring(user.name,0,1)}">M</span>
                        <span th:text="${user.name}">Employee</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><span class="dropdown-item-text text-muted small">Signed in</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </div>
</nav>

<div class="container py-5">

    <!-- Profile Summary Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">User Profile Details</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <strong>Employee ID:</strong> <span th:text="${user.employeeId}">EMP001</span>
                </div>
                <div class="col-md-4">
                    <strong>Full Name:</strong> <span th:text="${user.name}">John Doe</span>
                </div>
                <div class="col-md-4">
                    <strong>Email:</strong> <span th:text="${user.email}">john@example.com</span>
                </div>
                <div class="col-md-4">
                    <strong>Department:</strong> <span th:text="${user.department}">IT</span>
                </div>
                <div class="col-md-4">
                    <strong>Designation:</strong> <span th:text="${user.designation}">Developer</span>
                </div>
                <div class="col-md-4">
                    <strong>Phone:</strong> <span th:text="${user.phone}">+123456789</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Example: Rendering records from an associated table (e.g. Bookings or Roles) -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
            <h5 class="card-title mb-0">Assigned Roles</h5>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Role Name</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="userRole, stat : ${user.userRoles}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${userRole.role.roleName}">ROLE_EMPLOYEE</td>
                </tr>
                <tr th:if="${#lists.isEmpty(user.userRoles)}">
                    <td colspan="2" class="text-muted text-center">No roles assigned.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
