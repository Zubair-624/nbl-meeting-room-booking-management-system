<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
        <div class="navbar-nav gap-2 align-items-center">
            <a class="nav-link" href="/admin/dashboard">Dashboard</a>
            <a class="nav-link" href="/admin/rooms">Rooms</a>
            <a class="nav-link" href="/admin/facilities">Facilities</a>
            <a class="nav-link" href="/admin/users">Users</a>
            <a class="nav-link" href="/admin/bookings">Bookings</a>
            <a class="nav-link" href="/admin/reports">Reports</a>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="fw-bold mb-4">Reports</h3>

    <div class="card shadow-sm border-0 p-4 mb-4">
        <h5 class="fw-bold mb-3">Booking Report (by date range)</h5>
        <form id="bookingReportForm" class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-control" id="startDate" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">End Date</label>
                <input type="date" class="form-control" id="endDate" required>
            </div>
            <div class="col-md-4 d-flex align-items-end gap-2 flex-wrap">
                <button type="button" class="btn btn-primary" onclick="viewReport()">View Report</button>
                <button type="button" class="btn btn-success" onclick="downloadReport('excel')">Export Excel</button>
                <button type="button" class="btn btn-danger" onclick="downloadReport('pdf')">Export PDF</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm border-0 p-4">
        <h5 class="fw-bold mb-3">Room Utilization Report</h5>
        <a href="/admin/reports/room-utilization/excel" class="btn btn-success">Export Excel</a>
    </div>
</div>

<script>
    function downloadReport(type) {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        if (!start || !end) {
            alert('Please select both start and end dates.');
            return;
        }
        window.location.href = `/admin/reports/bookings/${type}?startDate=${start}&endDate=${end}`;
    }

    function viewReport() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        if (!start || !end) {
            alert('Please select both start and end dates.');
            return;
        }
        window.open(`/admin/reports/bookings/view?startDate=${start}&endDate=${end}`, '_blank');
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
