<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Facilities - MRBMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">MRBMS Admin</a>
        <div class="navbar-nav gap-2 align-items-center">
            <a class="nav-link" href="/admin/dashboard">Dashboard</a>
            <a class="nav-link" href="/admin/rooms">Rooms</a>
            <a class="nav-link active" href="/admin/facilities">Facilities</a>
            <a class="nav-link" href="/admin/users">Users</a>
            <a class="nav-link" href="/admin/bookings">Bookings</a>
            <a class="nav-link" href="/admin/reports">Reports</a>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="fw-bold mb-0">Facilities for <span th:text="${room.roomName}">Room</span></h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/admin/facilities/assign/{roomId}(roomId=${room.roomId})}" method="post">

                        <div class="form-check mb-2" th:each="facility : ${allFacilities}">
                            <input class="form-check-input" type="checkbox" name="facilityIds"
                                   th:value="${facility.facilityId}" th:id="'facility-' + ${facility.facilityId}"
                                   th:checked="${assignedFacilities.contains(facility)}">
                            <label class="form-check-label" th:for="'facility-' + ${facility.facilityId}"
                                   th:text="${facility.facilityName}">Projector</label>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/admin/rooms" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Save Facilities</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
